<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>ປະເມີນພະນັກງານ · Incentive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#13213a; --muted:#64708a; --line:#e3e8f0;
  --navy:#0f2a44; --sun:#f5a524; --sun-soft:#fff4dc; --ok:#1f9d6b; --warn:#d9822b; --bad:#d64545;
  --s1:#e86a5a; --s2:#f0a060; --s3:#d9c25a; --s4:#7cc47a; --s5:#2fa46d;
  --shadow:0 1px 2px rgba(15,42,68,.06),0 6px 20px rgba(15,42,68,.07);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1524; --card:#142136; --ink:#e8edf6; --muted:#9aa7bd; --line:#24344f;
    --navy:#0a1a2c; --sun-soft:#3a2e14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1524; --card:#142136; --ink:#e8edf6; --muted:#9aa7bd; --line:#24344f;
  --navy:#0a1a2c; --sun-soft:#3a2e14; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Lao',system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.hero{background:linear-gradient(135deg,#0f2a44 0%,#16406a 60%,#1d5a8a 100%);color:#fff;padding:28px 16px 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#f5a524 0%,rgba(245,165,36,.0) 70%);opacity:.55}
.hero .in{max-width:720px;margin:0 auto;position:relative;z-index:1}
.hero .org{font-size:13px;opacity:.8;letter-spacing:.02em}
.hero h1{font-size:24px;margin:4px 0 2px;font-weight:800}
.hero .en{font-size:13px;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:99px;font-size:13px;margin-top:12px}
.lift{margin-top:-44px;position:relative;z-index:2}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:13px} .en-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
h2{font-size:19px;margin:0 0 4px} h3{font-size:16px;margin:0}
.role{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.role:hover{border-color:var(--sun);transform:translateY(-1px)}
.role .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--sun-soft);flex:none}
.role b{display:block;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;transition:.15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sun{background:var(--sun);color:#1b1300}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px}
.field{margin:12px 0}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
.input:focus{border-color:var(--sun)}
.pin{letter-spacing:.6em;text-align:center;font-size:24px;font-weight:700}
.names{display:grid;gap:8px}
.name{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%}
.name.on{border-color:var(--sun);background:var(--sun-soft)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:16px}
.err{background:#fde8e8;color:#9b1c1c;padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#f7c35c);border-radius:9px;transition:width .3s}
.who{display:flex;align-items:center;gap:14px}
.who .av{width:54px;height:54px;font-size:20px}
.score-live{margin-left:auto;text-align:right}
.score-live b{font-size:26px;font-weight:800;line-height:1}
.crit{padding:16px}
.crit-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.wchip{margin-left:auto;font-size:12px;font-weight:700;background:var(--sun-soft);color:#8a5a00;padding:3px 9px;border-radius:99px;white-space:nowrap}
:root[data-theme="dark"] .wchip{color:#f5c56a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wchip{color:#f5c56a}}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0 8px;cursor:pointer;font-weight:800;font-size:18px;transition:.12s;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbtn small{font-size:10px;font-weight:500;color:var(--muted)}
.sbtn:hover{transform:translateY(-1px)}
.sbtn.on{color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.sbtn.on small{color:rgba(255,255,255,.9)}
.sbtn.v1.on{background:var(--s1)} .sbtn.v2.on{background:var(--s2)} .sbtn.v3.on{background:var(--s3)} .sbtn.v4.on{background:var(--s4)} .sbtn.v5.on{background:var(--s5)}
.anchor{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;border-left:4px solid var(--line)}
.anchor.v1{border-color:var(--s1)} .anchor.v2{border-color:var(--s2)} .anchor.v3{border-color:var(--s3)} .anchor.v4{border-color:var(--s4)} .anchor.v5{border-color:var(--s5)}
.reason{margin-top:10px}
.reason textarea,.note textarea{width:100%;min-height:64px;border-radius:10px;border:1.5px solid var(--warn);padding:10px;background:var(--card);resize:vertical;outline:none}
.note textarea{border-color:var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(0,0,0,0),var(--bg) 30%);padding:18px 16px 16px}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.tip{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--sun-soft);font-size:14px;margin-bottom:10px}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;gap:10px;align-items:center;font-size:14px}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.rank-item{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);flex:none}
.medal.m1{background:#f5c542;color:#4a3500} .medal.m2{background:#cfd6e0;color:#2b3442} .medal.m3{background:#e0a36b;color:#3d2410}
.arrows{margin-left:auto;display:flex;gap:6px}
.arrows button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.arrows button:disabled{opacity:.3}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.row{display:flex;align-items:center;gap:10px}
.warnbox{background:#fff3e0;color:#7a4300;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
:root[data-theme="dark"] .warnbox{background:#3a2a12;color:#f3cf98}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warnbox{background:#3a2a12;color:#f3cf98} :root:not([data-theme="light"]) .err{background:#3c1a1a;color:#f6b4b4}}
.done{text-align:center;padding:40px 18px}
.done .big{font-size:64px}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800}
.person{cursor:pointer}
.person .top{display:flex;align-items:center;gap:12px}
.final{margin-left:auto;text-align:right}
.final b{font-size:28px;font-weight:800;line-height:1}
.grade{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-top:4px}
.g-a{background:#d9f5e7;color:#0d6b43} .g-b{background:#e2f0ff;color:#1b4f8a} .g-c{background:#eef3d6;color:#56651a} .g-d{background:#fff0d9;color:#8a5200} .g-e{background:#f3e8ff;color:#5b2a8a} .g-none{background:var(--line);color:var(--muted)}
.mini{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
@media(min-width:560px){.mini{grid-template-columns:200px 1fr 40px}}
.detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.fb{display:grid;gap:8px;grid-template-columns:1fr;margin:10px 0}
@media(min-width:560px){.fb{grid-template-columns:1fr 1fr}}
.fb div{background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
.quote{font-size:13px;background:var(--bg);padding:8px 10px;border-radius:8px;margin:6px 0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--navy);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.addbox{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border:1.5px dashed var(--line)}
.okbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:#e3f6ec;color:#0d5c3a;font-size:14px}
.pinbig{font-size:26px;font-weight:800;letter-spacing:.3em;font-variant-numeric:tabular-nums;margin-right:auto}
.pinchip{font-weight:800;letter-spacing:.2em;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:8px}
.status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:auto}
.s-on{background:#d9f5e7;color:#0d6b43} .s-off{background:var(--line);color:var(--muted)}
.emp.off{opacity:.6}
.role:disabled{opacity:.45;cursor:not-allowed;transform:none}
.wincard{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r);padding:16px;margin-bottom:14px;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.wincard.open{border-color:#8fd3b0}
.wincard.closed{border-color:var(--line)}
.wic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg);flex:none}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,157,107,.5);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(31,157,107,0)}100%{box-shadow:0 0 0 0 rgba(31,157,107,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.fade{animation:none}}
.countdown{margin-top:8px;font-size:14px;background:var(--sun-soft);padding:6px 10px;border-radius:8px;display:inline-block}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:3px;margin-top:12px}
.dd{height:20px;border-radius:5px;background:var(--bg);font-size:9px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.dd.w{background:var(--sun);color:#1b1300;font-weight:700}
.dd.t{outline:2px solid var(--ink);outline-offset:1px;font-weight:800;color:var(--ink)}
.dd.w.t{color:#1b1300}
.strip-l{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.w{background:var(--sun)} .lg.t{outline:2px solid var(--ink);background:var(--bg)}
.demo{background:#fff4dc;color:#7a4b00;text-align:center;font-size:12px;padding:6px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<a href="./" style="position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:50;background:#ffffffee;border:1px solid #0b6b4a55;color:#0b6b4a;border-radius:20px;padding:6px 12px;font:600 13px system-ui;text-decoration:none">‹ ໜ້າຫຼັກ</a>
<div id="app"></div>

<script>
/* ============ API bridge (Apps Script / Demo) ============ */
const DEMO = false;
function api(fn){
  const args = Array.prototype.slice.call(arguments,1);
  if (typeof API_URL==='undefined' || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL))
    return Promise.reject(new Error('API_URL ໃນ config.js ຍັງບໍ່ຖືກຕ້ອງ'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(r=>r.json())
    .then(j=>{ if(!j.ok) throw new Error(j.error||'ຜິດພາດ'); return j.data; })
    .catch(e=>{ throw (e instanceof TypeError ? new Error('ເຊື່ອມຕໍ່ບໍ່ໄດ້ — ກວດອິນເຕີເນັດ ແລະ API_URL / Deploy ເວີຊັນໃໝ່') : e); });
}

/* ============ State ============ */
const S = { init:null, view:'home', role:null, token:null, me:null, idx:0, ratings:{}, ranking:[], selId:null, err:'', busy:false, res:null, open:{}, tab:'res', emps:null, add:{open:false,msg:null} };
const $app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#3b82c4','#d9822b','#2fa46d','#8b5cf6','#e0567a','#0ea5a4','#c2410c','#4f46e5'];
const LV = ['ຕ້ອງປັບປຸງຫຼາຍ','ຕ້ອງປັບປຸງ','ຕາມມາດຕະຖານ','ດີ','ດີເລີດ'];
function shortName(n){ return String(n).replace(/^ທ່ານ\s*ນາງ\s*/,'').replace(/^ທ່ານ\s*/,'').replace(/^ນາງ\s*/,''); }
function initials(n){ const s=shortName(n).trim(); return s ? s.charAt(0) : '?'; }
function colorOf(id){ let h=0; String(id).split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0); return COLORS[h%COLORS.length]; }
function avatar(p,size){ return '<div class="av" style="background:'+colorOf(p.id)+(size?';width:'+size+'px;height:'+size+'px':'')+'">'+esc(initials(p.name))+'</div>'; }
function targets(){ return S.init.employees.filter(e=>e.id!==(S.me&&S.me.id)); }
function critW(){ return S.init.criteria.reduce((a,c)=>a+c.weight,0)||1; }
function rawScore(r){ if(!r) return null; let t=0,n=0; S.init.criteria.forEach(c=>{const v=r.scores[c.id]; if(v){t+=c.weight*(v-1)/4;n++;}}); return n===S.init.criteria.length? Math.round(100*t/critW()) : null; }
function partialScore(r){ let t=0,w=0; S.init.criteria.forEach(c=>{const v=r.scores[c.id]; if(v){t+=c.weight*(v-1)/4;w+=c.weight;}}); return w? Math.round(100*t/w):null; }
function needReason(v){ return S.init.requireReason && (v===5 || v<=2); }
function personComplete(id){ const r=S.ratings[id]; if(!r) return false; return S.init.criteria.every(c=>{const v=r.scores[c.id]; return v && (!needReason(v) || (r.reasons[c.id]||'').trim().length>=5);}); }
function go(v){ S.view=v; S.err=''; render(); window.scrollTo(0,0); }

/* ============ Boot ============ */
(function boot(){
  if (DEMO) document.getElementById('demoBar').innerHTML='<div class="demo">ໂໝດຕົວຢ່າງ (Demo) — ຂໍ້ມູນສົມມຸດ · PIN: 1111 · ລະຫັດຜູ້ບໍລິຫານ: EXEC01 · Admin: ADMIN1</div>';
  $app.innerHTML='<div class="hero"><div class="in"><h1>ກຳລັງໂຫຼດ…</h1></div></div>';
  api('apiInit').then(d=>{ S.init=d; if(DEMO && location.hash==='#results') return demoResults(); render(); }).catch(e=>{ $app.innerHTML='<div class="wrap"><div class="err">'+esc(e.message||e)+'</div></div>'; });
})();

function hero(title,en){
  return '<div class="hero"><div class="in"><div class="org">'+esc(S.init.org)+'</div><h1>'+title+'</h1><div class="en">'+(en||'')+'</div>'+
    '<div class="pill">📅 '+esc(S.init.period)+'</div></div></div>';
}

/* ============ Render ============ */
function render(){
  const v=S.view;
  if(v==='home') return vHome();
  if(v==='peerLogin') return vPeerLogin();
  if(v==='execLogin') return vExecLogin();
  if(v==='adminLogin') return vAdminLogin();
  if(v==='guide') return vGuide();
  if(v==='rate') return vRate();
  if(v==='rank') return vRank();
  if(v==='review') return vReview();
  if(v==='done') return vDone();
  if(v==='dash') return vDash();
}

function vHome(){
  const I=S.init;
  $app.innerHTML = hero('ແບບປະເມີນພະນັກງານ ເພື່ອ Incentive','Employee evaluation for incentive') +
  '<div class="wrap lift fade">'+
   winCard()+
   '<div class="card"><div class="small muted">ຄະແນນລວມ = ພະນັກງານປະເມີນກັນເອງ <b>'+Math.round(I.peerW*100)+'%</b> + ຜູ້ບໍລິຫານປະເມີນ <b>'+Math.round(I.execW*100)+'%</b>. ໃຊ້ເວລາປະມານ 5–8 ນາທີ. ຄຳຕອບຂອງທ່ານເປັນຄວາມລັບ.</div></div>'+
   '<button class="role" onclick="go(\'peerLogin\')" '+(I.open?'':'disabled')+'><div class="ic">🤝</div><div><b>ພະນັກງານ</b><span class="en-sub">Employee · ປະເມີນເພື່ອນຮ່ວມງານ ດ້ວຍ PIN ຂອງທ່ານ</span></div></button>'+

function monthStrip(w){
  const pr=String(w.today||'').split('/'); if(pr.length<3) return '';
  const d=+pr[0], m=+pr[1], y=+pr[2], dim=new Date(y,m,0).getDate();
  let h='<div class="strip" aria-label="ວັນທີເປີດປະເມີນໃນເດືອນນີ້">';
  for(let i=1;i<=dim;i++){ const inW=i>=w.from&&i<=w.to; h+='<span class="dd'+(inW?' w':'')+(i===d?' t':'')+'" title="'+i+'">'+(inW||i===d||i===1||i===dim?i:'')+'</span>'; }
  return h+'</div><div class="strip-l small muted"><span><i class="lg w"></i>ວັນເປີດປະເມີນ</span><span><i class="lg t"></i>ມື້ນີ້ '+esc(w.today)+'</span></div>';
}
function winCard(){
  const w=S.init.win||{}, I=S.init;
  if(!w.auto){ return I.open?'':'<div class="wincard closed"><div class="wic">🔒</div><div><b>ປິດການປະເມີນ</b><span class="en-sub">ຜູ້ດູແລລະບົບປິດໄວ້ຊົ່ວຄາວ · Evaluation is closed</span></div></div>'; }
  if(I.open){
    return '<div class="wincard open"><div class="wic"><span class="pulse"></span></div><div style="flex:1;min-width:0"><b>ເປີດຮັບການປະເມີນ</b> <span class="small">· ຮອດວັນທີ '+esc(w.closesOn)+' ('+(w.daysLeft===1?'ມື້ສຸດທ້າຍ!':'ເຫຼືອ '+w.daysLeft+' ມື້')+')</span>'+
      '<span class="en-sub">Open until '+esc(w.closesOn)+' · ເປີດທຸກວັນທີ '+w.from+'–'+w.to+' ຂອງເດືອນ</span>'+monthStrip(w)+'</div></div>';
  }
  return '<div class="wincard closed"><div class="wic">🔒</div><div style="flex:1;min-width:0"><b>ປິດການປະເມີນ</b>'+
    '<span class="en-sub">'+(w.manualClosed?'ຜູ້ດູແລລະບົບປິດໄວ້ຊົ່ວຄາວ · Closed by admin':'ລະບົບເປີດສະເພາະວັນທີ '+w.from+'–'+w.to+' ຂອງທຸກເດືອນ · Opens on the '+w.from+'th–'+w.to+'th of each month')+'</span>'+

}

    '<div class="prog"><i style="width:'+((S.idx)/total*100)+'%"></i></div></div>';

       '<div class="score-live"><b id="live">'+(ps==null?'–':ps)+'</b><div class="small muted">/100</div></div></div></div>';

      (v? '<div class="anchor v'+v+'"><b>'+v+' · '+LV[v-1]+':</b> '+esc(c.levels[v-1])+(c.levelsEn[v-1]?'<span class="en-sub">'+esc(c.levelsEn[v-1])+'</span>':'')+'</div>'
         : '<div class="anchor"><span class="muted">ມາດຕະຖານ (3):</span> '+esc(c.levels[2])+'</div>')+
      (v && needReason(v)? '<div class="reason"><textarea placeholder="ຕົວຢ່າງ / ເຫດຜົນ ທີ່ໃຫ້ '+v+' (ຢ່າງໜ້ອຍ 5 ຕົວອັກສອນ)" oninput="S.ratings[\''+p.id+'\'].reasons[\''+c.id+'\']=this.value;updDock()">'+esc(r.reasons[c.id]||'')+'</textarea></div>':'')+
    '</div>';
  });

  $app.innerHTML=h; updDock();

function setScore(pid,cid,n){
  const y=window.scrollY; S.ratings[pid].scores[cid]=n; render(); window.scrollTo(0,y);
}
function updDock(){ const b=document.getElementById('nx'); if(b){ const p=targets()[S.idx]; b.disabled=!personComplete(p.id); } }
function prevP(){ if(S.idx>0){S.idx--; go('rate');} else go('guide'); }
function nextP(){
  const T=targets();
  if(S.idx<T.length-1){ S.idx++; go('rate'); return; }
  if(S.role==='peer' && S.init.rankW>0){
    if(S.ranking.length!==T.length) S.ranking = T.slice().sort((a,b)=>(rawScore(S.ratings[b.id])||0)-(rawScore(S.ratings[a.id])||0)).map(t=>t.id);
    go('rank');
  } else go('review');
}

   '<div class="small muted" style="margin-top:8px">ລຽງໄວ້ໃຫ້ແລ້ວຕາມຄະແນນທີ່ທ່ານໃຫ້ — ກົດ ↑ ↓ ເພື່ອປັບ. ອັນດັບນີ້ມີນ້ຳໜັກ '+Math.round(S.init.rankW*100)+'% ຂອງສ່ວນພະນັກງານ.</div></div>';

function mv(i,d){ const a=S.ranking, j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; render(); }

function vReview(){
  const T=targets();

  const vals=sc.map(x=>x.s), spread=Math.max.apply(null,vals)-Math.min.apply(null,vals);

    ppl.forEach(p=>{ p.share=p.final!=null?p.final*p.final/tot:0; p.amount=Math.round(R.pool*p.share); });
